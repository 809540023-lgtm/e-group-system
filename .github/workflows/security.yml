# 秘密與依賴掃描（規劃書 17、18 章；模組 18）。
# 只讀取程式，不注入任何正式憑證。
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 22 * * *" # 台北時間每日 06:00

permissions:
  contents: read

jobs:
  secret-scan:
    name: 秘密掃描
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: 檢查是否誤提交 .env
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env 不得提交進版本控制"
            exit 1
          fi
          echo "未提交 .env"
      - name: 檢查機密是否使用 NEXT_PUBLIC_ 前綴
        run: |
          if grep -rInE 'NEXT_PUBLIC_[A-Z_]*(SECRET|KEY|TOKEN|PASSWORD|HASH)' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' .; then
            echo "::error::機密不得使用 NEXT_PUBLIC_ 前綴"
            exit 1
          fi
          echo "未發現以 NEXT_PUBLIC_ 曝露的機密"

  dependency-audit:
    name: 依賴稽核
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 稽核正式依賴
        run: npm audit --omit=dev --audit-level=high
