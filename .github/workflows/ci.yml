# CI（規劃書 18、20 章；模組 18）。
# PR 執行不得取得正式秘密：本檔只使用測試用假值，正式憑證一律不注入。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jp_test
          POSTGRES_USER: jp_admin
          POSTGRES_PASSWORD: ci-only-password
          TZ: Asia/Taipei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jp_admin -d jp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 測試用假值；不是正式憑證。
      DATABASE_URL: postgres://jp_admin:ci-only-password@127.0.0.1:5432/jp_test
      DATABASE_URL_WORKER: postgres://jp_admin:ci-only-password@127.0.0.1:5432/jp_test
      DATABASE_URL_REPORTER: postgres://jp_admin:ci-only-password@127.0.0.1:5432/jp_test
      SESSION_SECRET: ci-only-session-secret
      QUOTE_SIGNING_SECRET: ci-only-quote-secret
      PUBLIC_BASE_URL: http://127.0.0.1:3000
      AI_MODE: desktop_manual
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
      - name: 安裝依賴
        run: npm ci
      - name: 型別檢查
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: 單元與規則測試
        run: npm test
      - name: 資料庫遷移
        run: npm run db:migrate
      - name: 原生 PostgreSQL 多連線併發驗收
        run: npm run db:smoke
      - name: 建置
        run: npm run build
