# 開發環境（規劃書 18 章；模組 18）。
# 只供本機開發；不得當成正式商城。
# 用法：docker compose -f infra/compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-bookworm
    container_name: jp-dev-postgres
    environment:
      POSTGRES_DB: jp_dev
      POSTGRES_USER: jp_admin
      POSTGRES_PASSWORD: dev-only-password
      TZ: Asia/Taipei
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jp-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jp_admin -d jp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jp-dev-pgdata:
